name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only by default; a job asks for more only if it needs it.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is what branch protection requires: "CI / Test".
  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Versions
        run: |
          flutter --version
          dart --version
          node --version
          xcodebuild -version

      # Analysis, the engine, app and extension tests, then a release build.
      # (The launch check needs a screen session, which CI does not have.)
      - name: Analyze, test and build
        env:
          HAUL_SKIP_LAUNCH: "1"
        run: scripts/build_release.sh

      - name: Check the extension packages build
        run: extension/build.sh package

  # The same app on Windows: analysis, every test and a release build. GitHub's
  # Windows runners come with Visual Studio and its C++ tools, which the
  # sqlite3 native asset needs to build.
  windows:
    name: App (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build windows --release

  # Everything that does not need a Mac, on the cheaper Linux runners: the
  # engine and the extension's tests. (On a private repository a macOS minute
  # counts ten times against the free allowance; on a public one it is free.)
  engine-and-extension:
    name: Engine and extension (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Engine
        working-directory: packages/download_engine
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Extension
        working-directory: extension
        run: npm test

  # Real Chrome driving the real extension. Slow, so it runs only when asked
  # (Actions, CI, Run workflow); it never blocks a merge.
  extension-e2e:
    name: Extension in Chrome
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run the extension end-to-end checks
        working-directory: extension
        run: |
          node e2e/options.e2e.js
          node e2e/intercept.e2e.js
          node e2e/linkmenu.e2e.js
          node e2e/package.e2e.js
